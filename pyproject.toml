[build-system]
requires = ["setuptools", "wheel", "torch"]
build-backend = "setuptools.build_meta"

[project]
name = "miniTransformer"
version = "1.0.0"
dependencies = [
    "torch",
    "nvtx",
    "scipy",
    "nvshmem4py-cu12",
    "nvidia-nvshmem-cu12",
    "cuda-core==0.7.0",
    "nvidia-cutlass-dsl==4.4.2",
]
